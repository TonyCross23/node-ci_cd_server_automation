version: '3.8'

services:
  db:
    image: postgres:15.3-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: express_swagger_crud
    ports:
      - "5439:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      custom-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_swagger_crud"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: express-swagger-crud
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@172.28.0.10:5432/express_swagger_crud?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && pnpm start"
    networks:
      - custom-net

volumes:
  postgres-data:

networks:
  custom-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16